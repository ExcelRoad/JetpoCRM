
<div x-data="timepicker({ value: '{{ value|default:'' }}', name: '{{ name }}' })" x-modelable="timeValue" {% if model %}x-model="{{ model }}"{% endif %} class="relative w-full" x-cloak>
    <input type="hidden" name="{{ name }}" x-model="timeValue">
    
    <div class="relative">
        <input 
            type="text" 
            x-model="timeValue" 
            @click="openTimepicker()"
            @blur="validateTimeInput()"
            @keydown.escape="showTimepicker = false"
            class="input-field cursor-pointer w-full text-right" 
            placeholder="00:00"
            {% if required %}required{% endif %}
            maxlength="5"
        >
        <div class="absolute top-0 left-0 px-3 py-2 pointer-events-none">
        </div>
    </div>

    <!-- Timepicker Modal -->
    <div 
        x-show="showTimepicker" 
        @click.away="showTimepicker = false" 
        x-transition
        class="absolute top-full right-0 mt-1 bg-white border border-gray-200 rounded-lg shadow-xl z-50 p-4 w-64"
        style="display: none;"
    >
        <div class="mb-4 text-center">
            <div class="inline-flex items-center justify-center border border-gray-200 rounded-lg p-1 bg-gray-50">
                <button 
                    type="button" 
                    @click="step = 'hours'"
                    class="px-3 py-1 rounded-md text-sm font-medium transition-colors"
                    :class="step === 'hours' ? 'bg-white shadow text-indigo-600' : 'text-gray-500 hover:text-gray-700'"
                >
                    שעות
                </button>
                <span class="mx-1 text-gray-300">:</span>
                <button 
                    type="button" 
                    @click="step = 'minutes'"
                    class="px-3 py-1 rounded-md text-sm font-medium transition-colors"
                    :class="step === 'minutes' ? 'bg-white shadow text-indigo-600' : 'text-gray-500 hover:text-gray-700'"
                >
                    דקות
                </button>
            </div>
        </div>

        <!-- Hours Selection -->
        <div x-show="step === 'hours'" class="grid grid-cols-4 gap-2">
            <template x-for="h in hours" :key="h">
                <button 
                    type="button"
                    @click="selectHour(h)"
                    class="p-2 rounded-lg text-sm hover:bg-indigo-50 hover:text-indigo-600 transition-colors"
                    :class="isSelectedHour(h) ? 'bg-indigo-600 text-white hover:bg-indigo-700 hover:text-white' : 'text-gray-700'"
                    x-text="h"
                ></button>
            </template>
        </div>

        <!-- Minutes Selection -->
        <div x-show="step === 'minutes'" class="grid grid-cols-4 gap-2">
            <template x-for="m in minutes" :key="m">
                <button 
                    type="button"
                    @click="selectMinute(m)"
                    class="p-2 rounded-lg text-sm hover:bg-indigo-50 hover:text-indigo-600 transition-colors"
                    :class="isSelectedMinute(m) ? 'bg-indigo-600 text-white hover:bg-indigo-700 hover:text-white' : 'text-gray-700'"
                    x-text="m"
                ></button>
            </template>
        </div>
    </div>
</div>

<script>
    document.addEventListener('alpine:init', () => {
        if (!Alpine.data('timepicker')) {
            Alpine.data('timepicker', ({ value, name }) => ({
                showTimepicker: false,
                timeValue: value, // HH:mm
                step: 'hours', // 'hours' or 'minutes'
                
                hours: Array.from({ length: 24 }, (_, i) => String(i).padStart(2, '0')),
                minutes: Array.from({ length: 12 }, (_, i) => String(i * 5).padStart(2, '0')), // 5 minute intervals

                init() {
                    // Watch for external changes
                    this.$watch('timeValue', (val) => {
                        // Ensure format is HH:mm if valid
                        if (val && val.length === 5 && val.includes(':')) {
                            // already formatted or updated by manual input
                        } else if (!val) {
                            // cleared
                        }
                    });
                },

                openTimepicker() {
                    this.showTimepicker = true;
                    // Reset to hours step when reopening
                    this.step = 'hours';
                },

                validateTimeInput() {
                    if (!this.timeValue) return;

                    const timeRegex = /^([0-1]?[0-9]|2[0-3]):([0-5][0-9])$/;
                    if (!timeRegex.test(this.timeValue)) {
                        // Invalid format, clear or revert? clearing for now to be safe
                        // Try to be smart? e.g. "9" -> "09:00"? maybe too much magic for now.
                        // Let's just clear if straight up invalid
                        this.timeValue = ''; 
                    } else {
                        // Format nicely
                        const parts = this.timeValue.split(':');
                        const h = parts[0].padStart(2, '0');
                        const m = parts[1].padStart(2, '0');
                        this.timeValue = `${h}:${m}`;
                    }
                },

                selectHour(h) {
                    let currentMinute = '00';
                    if (this.timeValue && this.timeValue.includes(':')) {
                        currentMinute = this.timeValue.split(':')[1];
                    }
                    this.timeValue = `${h}:${currentMinute}`;
                    this.step = 'minutes';
                },

                selectMinute(m) {
                    let currentHour = '00';
                    if (this.timeValue && this.timeValue.includes(':')) {
                        currentHour = this.timeValue.split(':')[0];
                    }
                    this.timeValue = `${currentHour}:${m}`;
                    this.showTimepicker = false;
                    this.step = 'hours'; // Reset for next time
                },

                isSelectedHour(h) {
                    if (!this.timeValue || !this.timeValue.includes(':')) return false;
                    return this.timeValue.split(':')[0] === h;
                },

                isSelectedMinute(m) {
                    if (!this.timeValue || !this.timeValue.includes(':')) return false;
                    return this.timeValue.split(':')[1] === m;
                }
            }));
        }
    });
</script>
