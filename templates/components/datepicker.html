
<div x-data="datepicker({ value: '{{ value|default:'' }}', name: '{{ name }}' })" x-modelable="dateValue" {% if model %}x-model="{{ model }}"{% endif %} class="relative w-full" x-cloak>
    <input type="hidden" name="{{ name }}" x-model="dateValue">
    
    <div class="relative">
        <input 
            type="text" 
            x-model="formattedDate" 
            @click="showDatepicker = !showDatepicker"
            @blur="validateDateInput()"
            @keydown.escape="showDatepicker = false"
            class="input-field cursor-pointer" 
            placeholder="בחר תאריך..."
            {% if required %}required{% endif %}
        >
    </div>

    <!-- Datepicker Modal/Dropdown -->
    <div 
        x-show="showDatepicker" 
        @click.away="showDatepicker = false" 
        x-transition
        class="absolute top-full right-0 mt-1 bg-white border border-gray-200 rounded-lg shadow-xl z-50 p-4 w-72" 
        style="display: none;">
        
        <!-- Header: Month and Year -->
        <div class="flex justify-between items-center mb-4">
            <div class="w-2/3 pl-1 relative" x-data="{ open: false }">
                <button 
                    type="button"
                    @click="open = !open" 
                    @click.outside="open = false"
                    class="w-full border border-gray-300 rounded-md text-sm py-1.5 px-2 focus:outline-none focus:border-indigo-500 bg-white flex items-center justify-between text-right"
                >
                    <span x-text="months[month]"></span>
                    <svg class="size-4 text-gray-400 transition-transform duration-200" :class="open ? 'rotate-180' : ''" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M6 9L12 15L18 9" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </button>
                
                <div 
                    x-show="open" 
                    x-transition 
                    class="absolute z-50 w-full mt-1 bg-white border border-gray-200 rounded-lg shadow-lg max-h-48 overflow-y-auto"
                    style="display: none;"
                >
                    <template x-for="(m, index) in months" :key="index">
                        <button 
                            type="button"
                            @click="month = index; updateCalendar(); open = false"
                            class="w-full px-3 py-1.5 text-right hover:bg-gray-100 flex items-center justify-between transition-colors text-sm"
                            :class="month === index ? 'bg-indigo-50 text-indigo-600' : 'text-gray-700'"
                        >
                            <span x-text="m"></span>
                            <svg x-show="month === index" class="size-3" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <path d="M20 6L9 17L4 12" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            </svg>
                        </button>
                    </template>
                </div>
            </div>
            <div class="w-1/3 pr-1">
                <input 
                    type="number" 
                    x-model="year" 
                    @change="updateCalendar()" 
                    class="w-full border border-gray-300 rounded-md text-sm py-1.5 px-2 focus:outline-none focus:border-indigo-500"
                >
            </div>
        </div>

        <!-- Days of Week -->
        <div class="grid grid-cols-7 mb-2">
            <template x-for="day in days" :key="day">
                <div class="text-center">
                    <span class="text-xs font-semibold text-gray-600" x-text="day"></span>
                </div>
            </template>
        </div>

        <!-- Calendar Grid -->
        <div class="grid grid-cols-7 gap-1">
            <!-- Empty cells for days before start of month -->
            <template x-for="blank in blanks" :key="blank">
                <div class="h-8"></div>
            </template>
            
            <!-- Days of month -->
            <template x-for="date in no_of_days" :key="date">
                <div class="h-8">
                    <button 
                        type="button"
                        @click="selectDate(date)" 
                        class="w-full h-full flex items-center justify-center rounded-full text-sm transition-colors duration-200 focus:outline-none"
                        :class="{
                            'bg-indigo-600 text-white font-semibold': isSelected(date),
                            'bg-indigo-100 text-indigo-700 font-semibold border border-indigo-200': isToday(date) && !isSelected(date),
                            'hover:bg-gray-100 text-gray-700': !isSelected(date) && !isToday(date)
                        }"
                    >
                        <span x-text="date"></span>
                    </button>
                </div>
            </template>
        </div>
        
        <!-- Today Button -->
        <div class="mt-3 text-center border-t border-gray-100 pt-2">
              <button type="button" @click="gotoToday()" class="text-xs text-indigo-600 font-semibold hover:text-indigo-800">
                  היום
              </button>
        </div>
    </div>
</div>

<script>
    document.addEventListener('alpine:init', () => {
        // Check if datepicker component is already defined to avoid errors
        if (!Alpine.data('datepicker')) {
            Alpine.data('datepicker', ({ value, name }) => ({
                showDatepicker: false,
                dateValue: value, // YYYY-MM-DD
                formattedDate: '',
                
                month: '',
                year: '',
                no_of_days: [],
                blanks: [],
                days: ['א', 'ב', 'ג', 'ד', 'ה', 'ו', 'ש'],
                months: ['ינואר', 'פברואר', 'מרץ', 'אפריל', 'מאי', 'יוני', 'יולי', 'אוגוסט', 'ספטמבר', 'אוקטובר', 'נובמבר', 'דצמבר'],

                init() {
                    let today = new Date();
                    if (this.dateValue) {
                        today = new Date(this.dateValue);
                    }
                    this.month = today.getMonth();
                    this.year = today.getFullYear();
                    
                    if (this.dateValue) {
                        this.formattedDate = this.formatDateForDisplay(today);
                    } else {
                        // Ensure formattedDate is empty if no value
                        this.formattedDate = '';
                    }

                    this.updateCalendar();
                    
                    // Watch for external changes to value if needed (optional)
                    this.$watch('dateValue', (val) => {
                        if (val) {
                            const date = new Date(val);
                            this.month = date.getMonth();
                            this.year = date.getFullYear();
                            this.formattedDate = this.formatDateForDisplay(date);
                            this.updateCalendar();
                        } else {
                            this.formattedDate = '';
                        }
                    });
                },

                validateDateInput() {
                    if (!this.formattedDate) {
                        this.dateValue = '';
                        return;
                    }

                    // Strict Regex for DD/MM/YYYY
                    const dateRegex = /^(\d{1,2})\/(\d{1,2})\/(\d{4})$/;
                    const match = this.formattedDate.match(dateRegex);

                    if (match) {
                        const day = parseInt(match[1], 10);
                        const month = parseInt(match[2], 10);
                        const year = parseInt(match[3], 10);

                        // Check valid date components
                        const date = new Date(year, month - 1, day);
                        if (date.getFullYear() === year && date.getMonth() === month - 1 && date.getDate() === day) {
                            // Valid date
                            this.dateValue = `${year}-${String(month).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                            this.month = month - 1;
                            this.year = year;
                            this.updateCalendar();
                            return;
                        }
                    }
                    
                    // If invalid, revert to previous valid value or clear if it was empty
                    if (this.dateValue) {
                        const date = new Date(this.dateValue);
                        this.formattedDate = this.formatDateForDisplay(date);
                    } else {
                        this.formattedDate = '';
                    }
                },

                isToday(date) {
                    const today = new Date();
                    const d = new Date(this.year, this.month, date);
                    return today.toDateString() === d.toDateString();
                },

                isSelected(date) {
                    if (!this.dateValue) return false;
                    const d = new Date(this.year, this.month, date);
                    const selected = new Date(this.dateValue);
                    return d.toDateString() === selected.toDateString();
                },

                selectDate(date) {
                    const selectedDate = new Date(this.year, this.month, date);
                    // Add 1 day if timezone issues cause off-by-one, but constructing with (y, m, d) is usually safe for local time dates
                    
                    // Format as YYYY-MM-DD for value
                    // Note: getMonth() is 0-indexed, needed 1-indexed for string
                    const y = selectedDate.getFullYear();
                    const m = String(selectedDate.getMonth() + 1).padStart(2, '0');
                    const d = String(selectedDate.getDate()).padStart(2, '0');
                    
                    this.dateValue = `${y}-${m}-${d}`;
                    this.formattedDate = this.formatDateForDisplay(selectedDate);
                    this.showDatepicker = false;
                },
                
                gotoToday() {
                    const today = new Date();
                    this.month = today.getMonth();
                    this.year = today.getFullYear();
                    this.selectDate(today.getDate());
                    this.updateCalendar();
                },

                formatDateForDisplay(date) {
                    const y = date.getFullYear();
                    const m = String(date.getMonth() + 1).padStart(2, '0');
                    const d = String(date.getDate()).padStart(2, '0');
                    
                    // Hebrew format: DD/MM/YYYY
                    return `${d}/${m}/${y}`;
                },

                updateCalendar() {
                    const firstDay = new Date(this.year, this.month, 1);
                    const lastDay = new Date(this.year, this.month + 1, 0); // Last day of current month
                    const dayOfWeek = firstDay.getDay(); // 0 is Sunday
                    
                    this.blanks = Array.from({ length: dayOfWeek }, (_, i) => i + 1);
                    this.no_of_days = Array.from({ length: lastDay.getDate() }, (_, i) => i + 1);
                }
            }));
        }
    });
</script>
